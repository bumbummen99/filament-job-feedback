laravel: '@testbench'

providers:
  - SkyRaptor\FilamentJobFeedback\FilamentJobFeedbackServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - migrate
    - db:seed:
        --class: Workbench\Database\Seeders\DatabaseSeeder
    - filament:assets
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
